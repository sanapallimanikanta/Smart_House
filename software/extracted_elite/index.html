
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Gemini Smart Home Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0a;
        color: #ffffff;
        margin: 0;
        overflow: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Emitting Particles Animation */
      @keyframes emit {
        0% {
          transform: rotate(var(--angle)) translateY(0) scale(1);
          opacity: 1;
        }
        100% {
          transform: rotate(var(--angle)) translateY(var(--distance)) scale(0);
          opacity: 0;
        }
      }

      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--particle-color, #3b82f6);
        pointer-events: none;
        animation: emit var(--duration) linear infinite;
        animation-delay: var(--delay);
      }

      /* Pulsing Core */
      @keyframes core-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
      }
      .core-active {
        animation: core-pulse 2s ease-in-out infinite;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
    </style>
